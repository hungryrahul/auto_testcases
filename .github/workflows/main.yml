name: Example Workflow

on:
  pull_request:  # when PR created

jobs:
  example-job:
    runs-on: ubuntu-latest  # where job runs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "Hello from Workflow!"

      - name: Create file
        run: echo "Generated test" > test.txt

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: output-files
          path: test.txt
